# Builds Helm and publishes it to GitHub Pages at https://<owner>.github.io/octopos-helm/.
#
# One-time setup in the repository settings:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → New repository secret:
#      NPM_TOKEN = a GitHub token with read:packages that can read the @yeahuz packages.
#
# Pages has no API behind it, so the build runs on the in-browser demo backend (VITE_API_MOCK=on).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_MOCK: "on"
          VITE_API_URL: ""
      # Pages has no rewrite rules: a refresh on /octopos-helm/clients would be a 404. Serving the app
      # as the 404 page lets the router take over every path.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
