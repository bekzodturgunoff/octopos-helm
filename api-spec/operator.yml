# Octopos Helm — operator API contract.
# Mirrors src/api/types.ts and src/api/sdk.ts field for field; operationIds are the names the
# frontend already calls (hey-api will generate identical function names into @yeahuz/kdsx-api).
# Generated, but meant to be edited by hand from here on.
openapi: "3.0.0"
info:
  version: "0.1.0"
  title: OCTOPOS Operator API (Helm)
  description: "The cross-tenant API behind Octopos Helm. RPC-style paths like the rest of kdsx-api: GET for reads with query parameters, POST for writes with a JSON body. Every operation except signIn requires `Authorization: Bearer <sessionID>`. x-capability names the permission the server must check; the UI only hides what this would refuse."
security:
  - OperatorSession: []
tags:
  - name: OperatorAuth
  - name: OperatorMetrics
  - name: OperatorClients
  - name: OperatorBilling
  - name: Fleet
  - name: OperatorTasks
  - name: OperatorAudit
  - name: OperatorAnnouncements
  - name: OperatorTeam
  - name: OperatorAccess
  - name: OperatorViews
  - name: OperatorNotifications
paths:
  /operator.auth.signIn:
    post:
      operationId: signInOperator
      tags: [OperatorAuth]
      summary: Sign an operator in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /operator.auth.signOut:
    post:
      operationId: signOutOperator
      tags: [OperatorAuth]
      summary: End the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator.auth.verifyTwoFactor:
    post:
      operationId: verifyTwoFactor
      tags: [OperatorAuth]
      summary: Finish a sign-in that needed a code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyTwoFactorData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /operator.auth.twoFactor.setup:
    post:
      operationId: setupTwoFactor
      tags: [OperatorAuth]
      summary: Start two-factor set-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetup"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator.auth.twoFactor.enable:
    post:
      operationId: enableTwoFactor
      tags: [OperatorAuth]
      summary: Confirm with a first code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorEnabled"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator.auth.twoFactor.disable:
    post:
      operationId: disableTwoFactor
      tags: [OperatorAuth]
      summary: Turn two-factor off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [disabled]
                properties:
                  disabled:
                    type: boolean
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "422 REQUIRED while the team requires it."
  /operator.auth.stepUp:
    post:
      operationId: stepUp
      tags: [OperatorAuth]
      summary: Prove presence before a risky action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StepUpResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      description: "Risky operations answer 428 STEP_UP_REQUIRED without a valid X-Step-Up header: clients.suspend, subscriptions.cancel, invoices.void, fleet.retireNode, roles.delete, team.update, security.update, clients.impersonate (mode=full)."
  /operator.security.get:
    get:
      operationId: getSecuritySettings
      tags: [OperatorAuth]
      summary: Team security settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: team.read
  /operator.security.update:
    post:
      operationId: updateSecuritySettings
      tags: [OperatorAuth]
      summary: Change team security (needs X-Step-Up)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySettings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: team.write
  /operator.auth.me:
    get:
      operationId: getSignedInOperator
      tags: [OperatorAuth]
      summary: The signed-in operator with permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedInOperator"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /operator.metrics.overview:
    get:
      operationId: getOverviewMetrics
      tags: [OperatorMetrics]
      summary: Headline numbers for the overview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewMetrics"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
  /operator.attention:
    get:
      operationId: getAttention
      tags: [OperatorMetrics]
      summary: "What needs somebody, most urgent first"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttentionItem"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
      description: "Server-side rules so every operator sees the same list: open invoices past due, card charges failed in the last 3 days, trials ending within 3 days, installations whose supervisor answers but spoke does not, clients whose activity score fell below 45."
  /operator.clients.list:
    get:
      operationId: listClients
      tags: [OperatorClients]
      summary: Search and filter clients
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Name, slug, owner name or phone"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ClientStatus"
        - name: subscriptionStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SubscriptionStatus"
        - name: plan
          in: query
          required: false
          schema:
            type: string
          description: Plan slug
        - name: health
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HealthGrade"
        - name: accountManagerID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: onboarding
          in: query
          required: false
          schema:
            type: boolean
          description: Only clients with onboarding steps left
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, health, mrr, renewal, createdAt]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
  /operator.clients.get:
    get:
      operationId: getClient
      tags: [OperatorClients]
      summary: One client in full
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
  /operator.clients.create:
    post:
      operationId: createClient
      tags: [OperatorClients]
      summary: Create a tenant with its owner and subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
      description: "409 SLUG_TAKEN when the subdomain is in use."
  /operator.clients.update:
    post:
      operationId: updateClient
      tags: [OperatorClients]
      summary: Edit client details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
  /operator.clients.suspend:
    post:
      operationId: suspendClient
      tags: [OperatorClients]
      summary: Suspend access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdReasonData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
      description: Dash shows a payment notice and online ordering stops. Tills keep selling offline.
  /operator.clients.reactivate:
    post:
      operationId: reactivateClient
      tags: [OperatorClients]
      summary: Restore access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
  /operator.clients.impersonate:
    post:
      operationId: impersonateClient
      tags: [OperatorClients]
      summary: "Start a time-boxed support session in the client's dash"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpersonateData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonationResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.impersonate
      description: "One active session per operator (a new one ends the last). mode=full needs X-Step-Up (428 otherwise). Logged, and shown to the client as a banner with the reason."
  /operator.supportSessions.list:
    get:
      operationId: listSupportSessions
      tags: [OperatorClients]
      summary: Support sessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupportSession"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.impersonate
      parameters:
        - name: clientID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: operatorID
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
  /operator.supportSessions.end:
    post:
      operationId: endSupportSession
      tags: [OperatorClients]
      summary: End a session now
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.impersonate
  /operator.clients.onboarding.update:
    post:
      operationId: updateOnboardingStep
      tags: [OperatorClients]
      summary: Tick or untick a manual onboarding step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOnboardingData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientOnboarding"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
      description: "422 STEP_AUTOMATIC for firstSale/firstPayment. Completing every step moves an onboarding client to active."
  /operator.remoteAccess.create:
    post:
      operationId: createRemoteAccess
      tags: [OperatorClients]
      summary: "Save an AnyDesk ID for one of the client's machines"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteAccessData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccess"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
      description: "422 ANYDESK_ID_INVALID; 409 ANYDESK_ID_EXISTS."
  /operator.remoteAccess.update:
    post:
      operationId: updateRemoteAccess
      tags: [OperatorClients]
      summary: Edit a saved AnyDesk entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRemoteAccessData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccess"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
  /operator.remoteAccess.delete:
    post:
      operationId: deleteRemoteAccess
      tags: [OperatorClients]
      summary: Remove a saved AnyDesk entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdData"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
  /operator.remoteAccess.logConnection:
    post:
      operationId: logRemoteConnection
      tags: [OperatorClients]
      summary: Record that the caller connected with AnyDesk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccess"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
      description: "Called as Helm opens the anydesk: link; writes lastConnectedAt/By and an activity entry."
  /operator.clients.bulkUpdate:
    post:
      operationId: bulkUpdateClients
      tags: [OperatorClients]
      summary: Assign a manager or change tags on many clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateClientsData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResult"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.write
      description: "Clients outside the caller's scope are skipped, not failed."
  /operator.notes.list:
    get:
      operationId: listClientNotes
      tags: [OperatorClients]
      summary: "Notes on a client, pinned first"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
      parameters:
        - name: clientID
          in: query
          required: true
          schema:
            type: string
            format: uuid
  /operator.notes.create:
    post:
      operationId: createClientNote
      tags: [OperatorClients]
      summary: Add a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
  /operator.notes.delete:
    post:
      operationId: deleteClientNote
      tags: [OperatorClients]
      summary: "Delete one's own note"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdData"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: client.read
  /operator.subscriptions.changePlan:
    post:
      operationId: changeSubscriptionPlan
      tags: [OperatorBilling]
      summary: Change plan now (prorated) or at period end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePlanData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.write
  /operator.subscriptions.extend:
    post:
      operationId: extendSubscription
      tags: [OperatorBilling]
      summary: Move the period end without an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendSubscriptionData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.write
      description: "Any whole number of days, 1–365. Counted from the later of the current period end and now, so a past-due client gets the days from today. 422 DAYS_INVALID / REASON_REQUIRED."
  /operator.subscriptions.cancel:
    post:
      operationId: cancelSubscription
      tags: [OperatorBilling]
      summary: Cancel now or at period end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSubscriptionData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.write
  /operator.plans.list:
    get:
      operationId: listPlans
      tags: [OperatorBilling]
      summary: Plans with counts and MRR
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.read
  /operator.billing.renewals:
    get:
      operationId: listRenewals
      tags: [OperatorBilling]
      summary: Subscriptions whose period ends in a window
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [renewals]
                properties:
                  renewals:
                    type: array
                    items:
                      $ref: "#/components/schemas/Renewal"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.read
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
  /operator.billing.overdue:
    get:
      operationId: listOverdueAccounts
      tags: [OperatorBilling]
      summary: "Open invoices past due, oldest first"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverdueAccount"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-capability: billing.read
  /operator.billing.sendReminder:
    post:
      operationId: sendPaymentReminder
      tags: [OperatorBilling]
      summary: Send a payment reminder
      requestBody:
