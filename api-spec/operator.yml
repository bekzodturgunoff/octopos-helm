      description: "422 LAST_OWNER when it would leave no active operator holding the Owner role; 422 ROLE_NOT_FOUND."
components:
  securitySchemes:
    OperatorSession:
      type: http
      scheme: bearer
      description: A session from operator.auth.signIn. The existing static OperatorToken can be accepted on the same header during migration.
    StepUp:
      type: apiKey
      in: header
      name: X-Step-Up
      description: "From operator.auth.stepUp, 5 minutes. Required on the risky operations listed there; they answer 428 without it."
  schemas:
    Error:
      type: object
      description: "Same body as kdsx-api's default Error response."
      required: [message, status, code, traceID]
      properties:
        message:
          type: string
        status:
          type: integer
        code:
          type: string
        traceID:
          type: string
    Money:
      type: object
      required: [amount, majorAmount, currency, display]
      properties:
        amount:
          type: integer
          description: Minor units.
        majorAmount:
          type: number
        currency:
          type: string
        display:
          type: string
          description: "Formatted by the server, e.g. \"590 000 so'm\"."
    PermissionScope:
      type: string
      enum: [all, assigned]
      description: "assigned = only clients whose accountManager is the operator. The server must filter every client and billing list, and refuse single reads/writes outside it."
    Permission:
      type: object
      required: [capability]
      properties:
        capability:
          oneOf:
            - $ref: "#/components/schemas/Capability"
            - type: string
              enum: ["*"]
        scope:
          $ref: "#/components/schemas/PermissionScope"
    RoleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Role:
      type: object
      required: [id, name, description, internal, permissions, memberCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        internal:
          type: boolean
          description: "Built-in Owner role: not deletable, permissions not editable."
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    CreateRoleData:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          minItems: 1
    UpdateRoleData:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          minItems: 1
    AccessCapability:
      type: object
      required: [value, name, scopes]
      properties:
        value:
          $ref: "#/components/schemas/Capability"
        name:
          type: string
        description:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/PermissionScope"
    AccessResource:
      type: object
      required: [code, name, capabilities]
      properties:
        code:
          type: string
        name:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AccessCapability"
    OperatorStatus:
      type: string
      enum: [active, invited, disabled]
    Capability:
      type: string
      enum:
        - client.read
        - client.write
        - client.impersonate
        - billing.read
        - billing.write
        - fleet.read
        - fleet.write
        - task.write
        - announcement.write
        - team.read
        - team.write
        - role.read
        - role.write
        - audit.read
    OperatorRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Operator:
      type: object
      required: [id, firstName, lastName, email, role, status, twoFactorEnabled, createdAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/RoleRef"
        status:
          $ref: "#/components/schemas/OperatorStatus"
        twoFactorEnabled:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    SignedInOperator:
      allOf:
        - $ref: "#/components/schemas/Operator"
        - type: object
          required: [mustSetUpTwoFactor, permissions]
          properties:
            mustSetUpTwoFactor:
              type: boolean
              description: "Team requires two-factor and this operator has none: the UI allows only the set-up page."
            permissions:
              type: object
              description: "Capability → its scope (\"all\" | \"assigned\"), or true for a capability without scopes. \"*\": true grants everything, as in SignedInUser. Derived from the operator's role."
              additionalProperties:
                oneOf:
                  - type: boolean
                  - $ref: "#/components/schemas/PermissionScope"
    SignInData:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    SignInResult:
      oneOf:
        - type: object
          required: [sessionID, operator]
          properties:
            sessionID:
              type: string
              description: "Sent back as Authorization: Bearer <sessionID>."
            operator:
              $ref: "#/components/schemas/SignedInOperator"
            twoFactorRequired:
              type: boolean
              enum: [false]
        - type: object
          required: [twoFactorRequired, challengeID]
          properties:
            twoFactorRequired:
              type: boolean
              enum: [true]
            challengeID:
              type: string
              description: Valid 5 minutes; pass to operator.auth.verifyTwoFactor.
    VerifyTwoFactorData:
      type: object
      required: [challengeID, code]
      properties:
        challengeID:
          type: string
        code:
          type: string
          pattern: "^\\d{6}$|^[a-z0-9]{4}-[a-z0-9]{4}$"
          description: "6-digit TOTP or a one-time recovery code."
    TwoFactorSetup:
      type: object
      required: [secret, otpauthURL]
      properties:
        secret:
          type: string
          description: "Base32 TOTP secret, SHA-1, 6 digits, 30 s."
        otpauthURL:
          type: string
    TwoFactorEnabled:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    StepUpData:
      type: object
      description: "code for operators with two-factor, password otherwise."
      properties:
        code:
          type: string
        password:
          type: string
    StepUpResult:
      type: object
      required: [token, expiresAt]
      properties:
        token:
          type: string
          description: "Send as X-Step-Up on the risky call. Valid 5 minutes, this operator only."
        expiresAt:
          type: string
          format: date-time
    SecuritySettings:
      type: object
      required: [requireTwoFactor, idleTimeoutHours]
      properties:
        requireTwoFactor:
          type: boolean
        idleTimeoutHours:
          type: integer
          minimum: 1
          maximum: 72
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/OperatorRef"
    BillingCycle:
      type: string
      enum: [monthly, yearly]
    BillingVendor:
      type: string
      enum: [none, creem, octo, payme, click, dodo]
    PlanRef:
      type: object
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    PlanPrice:
      type: object
      required: [id, billingCycle, value]
      properties:
        id:
          type: string
          format: uuid
        billingCycle:
          $ref: "#/components/schemas/BillingCycle"
        value:
          $ref: "#/components/schemas/Money"
    PlanFeature:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
          description: "billing/plan FeatureKey name, e.g. PointOfSale."
        type:
          type: string
          enum: [toggle, limit]
        limit:
          type: integer
    Plan:
      type: object
      required: [id, slug, name, position, prices, features, clientCount, mrr]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        position:
          type: integer
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PlanPrice"
        features:
          type: array
          items:
            $ref: "#/components/schemas/PlanFeature"
        clientCount:
          type: integer
        mrr:
          $ref: "#/components/schemas/Money"
    SubscriptionStatus:
      type: string
      enum: [pending, active, canceled, scheduledCancel, pastDue, expired, trialing]
    ClientStatus:
      type: string
      enum: [onboarding, active, suspended, churned]
    HealthGrade:
      type: string
      enum: [good, watch, atRisk]
    BusinessType:
      type: string
      enum: [restaurant, cafe, fastFood, bar, bakery, retail, other]
    ClientHealth:
      type: object
      description: "Computed server-side. Suggested weights: payment 40%, activity 35%, fleet 25%. grade: good ≥ 70, watch ≥ 45, else atRisk."
      required: [score, grade, payment, fleet, activity]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        grade:
          $ref: "#/components/schemas/HealthGrade"
        payment:
          type: integer
          minimum: 0
          maximum: 100
        fleet:
          type: integer
          minimum: 0
          maximum: 100
        activity:
          type: integer
          minimum: 0
          maximum: 100
    ClientSubscription:
      type: object
      required: [id, status, plan, billingCycle, vendor, nativeBilling, amount, periodStart, periodEnd]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        plan:
          $ref: "#/components/schemas/PlanRef"
        billingCycle:
          $ref: "#/components/schemas/BillingCycle"
        vendor:
          $ref: "#/components/schemas/BillingVendor"
        nativeBilling:
          type: boolean
          description: The provider charges a saved card itself.
        amount:
          $ref: "#/components/schemas/Money"
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        trialEndsAt:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
        pendingPlan:
          $ref: "#/components/schemas/PlanRef"
    ClientInstallations:
      type: object
      required: [total, healthy, degraded, failing, offline]
      properties:
        total:
          type: integer
        healthy:
          type: integer
        degraded:
          type: integer
        failing:
          type: integer
          description: "Supervisor answers, spoke does not (crashLooping/misconfigured/neverStarted)."
        offline:
          type: integer
    ClientContact:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        telegram:
          type: string
        role:
          type: string
    Client:
      type: object
      required:
        - id
        - name
        - slug
        - businessType
        - status
        - owner
        - balanceDue
        - mrr
        - health
        - installations
        - locationsCount
        - usersCount
        - tags
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Dash subdomain.
        businessType:
          $ref: "#/components/schemas/BusinessType"
        status:
          $ref: "#/components/schemas/ClientStatus"
        city:
          type: string
        owner:
          $ref: "#/components/schemas/ClientContact"
        subscription:
          $ref: "#/components/schemas/ClientSubscription"
        balanceDue:
          $ref: "#/components/schemas/Money"
        mrr:
          $ref: "#/components/schemas/Money"
        health:
          $ref: "#/components/schemas/ClientHealth"
        installations:
          $ref: "#/components/schemas/ClientInstallations"
        locationsCount:
          type: integer
        usersCount:
          type: integer
        accountManager:
          $ref: "#/components/schemas/OperatorRef"
        tags:
          type: array
          items:
            type: string
        onboarding:
          $ref: "#/components/schemas/OnboardingSummary"
        lastActiveAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    RemoteAccess:
      type: object
      required: [id, label, anydeskID, unattended, createdAt]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        anydeskID:
          type: string
          pattern: "^\\d{9,10}$"
        locationID:
          type: string
          format: uuid
        locationName:
          type: string
        nodeID:
          type: string
          format: uuid
        unattended:
          type: boolean
        passwordNote:
          type: string
          description: Where the team keeps the password. The password itself is never stored.
        note:
          type: string
        lastConnectedAt:
          type: string
          format: date-time
        lastConnectedBy:
          $ref: "#/components/schemas/OperatorRef"
        createdAt:
          type: string
          format: date-time
    RemoteAccessData:
      type: object
      required: [clientID, label, anydeskID, unattended]
      properties:
        clientID:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
        anydeskID:
          type: string
          pattern: "^\\d{9,10}$"
        locationID:
          type: string
          format: uuid
        nodeID:
          type: string
          format: uuid
        unattended:
          type: boolean
        passwordNote:
          type: string
        note:
          type: string
    UpdateRemoteAccessData:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
        anydeskID:
          type: string
          pattern: "^\\d{9,10}$"
        locationID:
          type: string
          format: uuid
        nodeID:
          type: string
          format: uuid
        unattended:
          type: boolean
        passwordNote:
          type: string
        note:
          type: string
    OnboardingStepKey:
      type: string
      enum: [signed, installBooked, installed, menuLoaded, staffAdded, trained, firstSale, firstPayment]
    OnboardingStep:
      type: object
      required: [key, done, automatic]
      properties:
        key:
          $ref: "#/components/schemas/OnboardingStepKey"
        done:
          type: boolean
        doneAt:
          type: string
          format: date-time
        doneBy:
