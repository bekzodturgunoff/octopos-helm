      type: object
      required: [enabled, retryDays, reminderDays, finalNoticeDay, graceDays, autoSuspend, autoReactivate, channels, includePayLink, quietHours, templates]
      properties:
        enabled:
          type: boolean
        retryDays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 90
        reminderDays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 90
        finalNoticeDay:
          type: integer
        graceDays:
          type: integer
          description: "Suspend after this many days unpaid. Must be > finalNoticeDay."
