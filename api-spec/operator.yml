              type: string
              description: Added for the operator listing.
      description: "kdsx-api's FleetNode (schemas/Fleet.yml) plus tenantName. Helm reads: nodeID, tenantID, runningVersion, runningCommit, os, arch, schemaVersion, startedAt, pendingUploads, behindBy, parkedOutstanding, oldestParkedAt, unresolvedConflicts, lastExchangeAt, agentVersion, childState, restartCount, lastExitCode, lastStderrTail, lastCheckinAt, updateState, lastUpdateError, targetVersion, updatePaused, supervised, lanURLs, lanName, location, retiredAt."
    FleetNodeRetireData:
      $ref: "../../kdsx-api/api-specs/schemas/Fleet.yml#/FleetNodeRetireData"
    SetFleetNodeTargetData:
      type: object
      required: [nodeID, updatePaused]
      properties:
        nodeID:
          type: string
          format: uuid
        targetVersion:
          type: string
          description: "Absent: follow the default release."
        updatePaused:
          type: boolean
    Release:
      type: object
      required: [version, channel, releasedAt, notes, running, targeted, isDefault]
      properties:
        version:
          type: string
        channel:
          type: string
          enum: [stable, beta]
        releasedAt:
          type: string
          format: date-time
        notes:
          type: string
        running:
          type: integer
        targeted:
          type: integer
        isDefault:
          type: boolean
    MrrPoint:
      type: object
      required: [month, mrr, newMrr, churnedMrr]
      properties:
        month:
          type: string
          pattern: "^\\d{4}-\\d{2}$"
        mrr:
          type: number
        newMrr:
          type: number
        churnedMrr:
          type: number
    OverviewMetrics:
      type: object
      required:
        - currency
        - mrr
        - mrrChange
        - activeClients
        - newClientsThisMonth
        - trialing
        - pastDueCount
        - pastDueAmount
        - churnRate
        - renewalsNext7Days
        - renewalsNext7DaysAmount
        - collectionRate
        - medianDaysToFirstSale
        - onboardingClients
        - fleet
        - mrrHistory
        - planMix
      properties:
        currency:
          type: string
        mrr:
          $ref: "#/components/schemas/Money"
        mrrChange:
          type: number
          description: Fraction vs same day last month.
        activeClients:
          type: integer
        newClientsThisMonth:
          type: integer
        trialing:
          type: integer
        pastDueCount:
          type: integer
        pastDueAmount:
          $ref: "#/components/schemas/Money"
        churnRate:
          type: number
          description: "Logo churn, last 30 days, fraction."
        renewalsNext7Days:
          type: integer
        renewalsNext7DaysAmount:
          $ref: "#/components/schemas/Money"
        collectionRate:
          type: number
          description: "Share of last month's renewals collected without a reminder."
        medianDaysToFirstSale:
          type: integer
        onboardingClients:
          type: integer
        fleet:
          $ref: "#/components/schemas/ClientInstallations"
        mrrHistory:
          type: array
          items:
            $ref: "#/components/schemas/MrrPoint"
        planMix:
          type: array
          items:
            type: object
            required: [plan, clients, mrr]
            properties:
              plan:
                $ref: "#/components/schemas/PlanRef"
              clients:
                type: integer
              mrr:
                type: number
    AttentionItem:
      type: object
      required: [id, kind, severity, clientID, clientName, title, detail, at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [pastDue, paymentFailed, trialEnding, fleetFailing, inactive, renewalDue, onboardingStalled, noFirstSale]
        severity:
          type: string
          enum: [high, medium, low]
        clientID:
          type: string
          format: uuid
        clientName:
          type: string
        title:
          type: string
        detail:
          type: string
        at:
          type: string
          format: date-time
    Note:
      type: object
      required: [id, clientID, body, pinned, author, createdAt]
      properties:
        id:
          type: string
          format: uuid
        clientID:
          type: string
          format: uuid
        body:
          type: string
        pinned:
          type: boolean
        author:
          $ref: "#/components/schemas/OperatorRef"
        createdAt:
          type: string
          format: date-time
    CreateNoteData:
      type: object
      required: [clientID, body]
      properties:
        clientID:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
        pinned:
          type: boolean
    TaskStatus:
      type: string
      enum: [open, done]
    TaskPriority:
      type: string
      enum: [low, normal, high]
    TaskKind:
      type: string
      enum: [followUp, call, payment, install, other]
    Task:
      type: object
      required: [id, title, kind, priority, status, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        clientID:
          type: string
          format: uuid
        clientName:
          type: string
        assignee:
          $ref: "#/components/schemas/OperatorRef"
        dueAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        completedBy:
          $ref: "#/components/schemas/OperatorRef"
        createdBy:
          $ref: "#/components/schemas/OperatorRef"
        createdAt:
          type: string
          format: date-time
    TaskCounts:
      type: object
      required: [mine, everyone, unassigned, overdue, dueToday]
      properties:
        mine:
          type: integer
          description: "Open, assigned to the caller."
        everyone:
          type: integer
          description: "Open, anyone."
        unassigned:
          type: integer
        overdue:
          type: integer
          description: "Caller's open tasks due before today."
        dueToday:
          type: integer
          description: "Caller's open tasks due today."
    CreateTaskData:
      type: object
      required: [title, kind, priority]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        clientID:
          type: string
          format: uuid
        assigneeID:
          type: string
          format: uuid
        dueAt:
          type: string
          format: date-time
    UpdateTaskData:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        description:
          type: string
        kind:
          $ref: "#/components/schemas/TaskKind"
        status:
          $ref: "#/components/schemas/TaskStatus"
        assigneeID:
          type: string
          format: uuid
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: "#/components/schemas/TaskPriority"
    ActivityCategory:
      type: string
      enum: [payment, billing, support, note, fleet, client, team]
    ActivityEvent:
      type: object
      required: [id, category, actor, action, summary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ActivityCategory"
        hash:
          type: string
          description: "sha256(previous hash | id | action | actor | summary | createdAt). Append-only: no update or delete exists."
        actor:
          type: object
          required: [kind, name]
          properties:
            kind:
              type: string
              enum: [operator, system, client]
            id:
              type: string
              format: uuid
            name:
              type: string
        action:
          type: string
          description: "Dotted, e.g. client.suspended, payment.failed."
        summary:
          type: string
        clientID:
          type: string
          format: uuid
        clientName:
          type: string
        createdAt:
          type: string
          format: date-time
    ActivityPage:
      type: object
      required: [items, page, pages, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
    AnnouncementSeverity:
      type: string
      enum: [info, warning, critical]
    AnnouncementAudience:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [all]
        - type: object
          required: [kind, planSlugs]
          properties:
            kind:
              type: string
              enum: [plans]
            planSlugs:
              type: array
              items:
                type: string
        - type: object
          required: [kind, clientIDs]
          properties:
            kind:
              type: string
              enum: [clients]
            clientIDs:
              type: array
              items:
                type: string
                format: uuid
      discriminator:
        propertyName: kind
    Announcement:
      type: object
      description: "Shown in the clients' dash as a banner. kdsx-dash-v2 needs a matching read endpoint (e.g. announcements.current) to render it."
      required: [id, title, body, severity, audience, status, startsAt, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        severity:
          $ref: "#/components/schemas/AnnouncementSeverity"
        audience:
          $ref: "#/components/schemas/AnnouncementAudience"
        status:
          type: string
          enum: [scheduled, live, ended]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/OperatorRef"
        createdAt:
          type: string
          format: date-time
    CreateAnnouncementData:
      type: object
      required: [title, body, severity, audience, startsAt]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        body:
          type: string
          minLength: 1
          maxLength: 400
        severity:
          $ref: "#/components/schemas/AnnouncementSeverity"
        audience:
          $ref: "#/components/schemas/AnnouncementAudience"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    InviteOperatorData:
      type: object
      required: [email, firstName, lastName, roleID]
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roleID:
          type: string
          format: uuid
    UpdateOperatorData:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/RoleRef"
        status:
          $ref: "#/components/schemas/OperatorStatus"
